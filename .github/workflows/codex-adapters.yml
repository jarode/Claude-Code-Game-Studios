name: Codex adapter validation

on:
  push:
    paths:
      - 'AGENTS.md'
      - '.agents/**'
      - '.claude/skills/**'
      - '.claude/agents/**'
      - 'docs/app-studio/**'
      - 'scripts/install_app_studio.py'
      - 'studio-tests/app-studio/**'
      - 'docs/CODEX-CHATGPT.md'
      - 'studio-tests/codex/**'
      - '.github/workflows/codex-adapters.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/**'
      - '.claude/skills/**'
      - 'docs/CODEX-CHATGPT.md'
      - 'studio-tests/codex/**'
      - '.github/workflows/codex-adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate adapter coverage and references
        run: python studio-tests/codex/validate_adapters.py
      - name: Test standalone App Studio installer (dry-run, apply, conflict handling)
        run: python -m unittest discover -s studio-tests/app-studio -p 'test_*.py' -v
